[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# OQ-6 (re-checked 2026-08-05 after the Zeno CLI -> Xeno CLI rename):
#   PyPI `xeno`     TAKEN - lainproliant/xeno, "the Python IOC app and build
#                   framework from outer space" (v7.10.0). Dev tooling, so some
#                   adjacency, but not the AI-eval confusion that sank `zeno`.
#   PyPI `xeno-cli` AVAILABLE  <- what this package claims.
#   npm  `xeno-cli` TAKEN - an unrelated file-generation CLI. Irrelevant while
#                   this ships as a Python package; revisit before any npm
#                   distribution.
# Installable name is `xeno-cli`; `xeno` stays the invoked command and a
# documented shell alias only.
name = "xeno-cli"
version = "0.1.0.dev0"
description = "Terminal-native multi-agent coding harness with tier-routed models and one human gate"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hank Sha" }]
keywords = ["agent", "llm", "coding-agent", "langgraph", "cli"]

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "langgraph>=0.2",
    "docker>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "types-docker",
]

[project.scripts]
xeno = "xeno.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/xeno"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
packages = ["xeno"]
mypy_path = "src"
strict = true
warn_unreachable = true
