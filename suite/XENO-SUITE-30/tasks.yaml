        - tests_pending/test_zs25_typed_env_overrides.py::test_env_overrides_without_a_schema_keeps_every_value_a_string
        - tests_pending/test_zs25_typed_env_overrides.py::test_env_overrides_raises_validation_error_on_an_uncoercible_int
