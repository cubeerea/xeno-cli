      `trial_balance` return its rows sorted ascending by account code
      regardless of journal order, and append one final row with the code
      "TOTAL" whose debit and credit columns are the sums of the detail rows
      (and therefore equal to each other).
    acceptance:
      parse_ok: true
      lint_clean: true
      typecheck_clean: true
      tests_pass:
        - tests_pending/test_zs07_trial_balance_order.py::test_rows_are_sorted_by_account_code
        - tests_pending/test_zs07_trial_balance_order.py::test_last_row_is_the_totals_row
        - tests_pending/test_zs07_trial_balance_order.py::test_totals_row_debits_equal_credits
        - tests_pending/test_zs07_trial_balance_order.py::test_totals_row_sums_the_detail_rows
