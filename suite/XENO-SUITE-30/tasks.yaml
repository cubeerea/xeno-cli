        - tests_pending/test_zs05_hapax.py::test_hapax_legomena_excludes_repeats_and_handles_empty_text
        - tests_pending/test_zs05_hapax.py::test_analyse_reports_hapax_count
        - tests_pending/test_zs05_hapax.py::test_hapax_count_matches_hapax_legomena
        - tests_pending/test_zs05_hapax.py::test_existing_word_stats_fields_are_untouched
