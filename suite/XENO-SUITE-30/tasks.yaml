      this task infeasible once tests/ is frozen; it was replaced with an
      order-agnostic assertion before the freeze.

  - id: ZS-08
    kind: single_file
    fixture: fixtures/webapi
    goal: >
      Route patterns capture every `<name>` segment as a string. Add typed
      converters: `<int:name>` must match only all-digit segments and hand
      the handler a real `int`, while `<str:name>` and a bare `<name>` stay
      strings. A non-numeric segment must NOT match an `<int:...>` route, so
      a later route can still win. An unknown converter prefix is rejected
      when the route is registered.
    acceptance:
      parse_ok: true
      lint_clean: true
      typecheck_clean: true
      tests_pass:
        - tests_pending/test_zs08_typed_path_params.py::test_int_converter_yields_a_real_int
        - tests_pending/test_zs08_typed_path_params.py::test_int_converter_rejects_a_non_numeric_segment
        - tests_pending/test_zs08_typed_path_params.py::test_int_converter_still_matches_a_numeric_segment_for_allowed_methods
        - tests_pending/test_zs08_typed_path_params.py::test_str_converter_yields_a_string
        - tests_pending/test_zs08_typed_path_params.py::test_bare_placeholder_still_yields_a_string
        - tests_pending/test_zs08_typed_path_params.py::test_typed_and_untyped_routes_coexist_in_registration_order
        - tests_pending/test_zs08_typed_path_params.py::test_unknown_converter_is_rejected
      tests_must_still_pass:
        - tests/test_routing.py::test_placeholders_capture_strings
        - tests/test_routing.py::test_first_registered_route_wins
        - tests/test_routing.py::test_duplicate_placeholder_is_rejected
        - tests/test_app.py::test_path_parameters_reach_the_handler_context
      forbidden_changes:
        - tests/
        - tests_pending/
        - pyproject.toml
    expected_outcome: approve
    infeasible_reason: null
    notes: >
      The largest single-file task: pattern compilation plus matching plus
      conversion, all inside src/webapi/routing.py (compile_pattern and the
      placeholder type are the single choke point). Stresses the distinction
      between "did not match" and "matched then failed to convert" - getting
      that wrong breaks route precedence. Seven assert-failing tests at
      baseline. Feasibility confirmed against a reference solution.

  - id: ZS-09
    kind: single_file
    fixture: fixtures/etl
    goal: >
      Add a `drop_nulls(fields=None)` transform. It drops a row (by returning
      None, the existing drop protocol) when any of the named fields is None
      or missing; with fields=None it checks every field present on the row.
      Falsy-but-present values such as 0, "" and False are NOT nulls and must
      be kept. It must accept any sequence of field names.
    acceptance:
      parse_ok: true
      lint_clean: true
      typecheck_clean: true
      tests_pass:
        - tests_pending/test_zs09_drop_nulls.py::test_drop_nulls_drops_row_with_null_named_field
        - tests_pending/test_zs09_drop_nulls.py::test_drop_nulls_drops_row_with_missing_named_field
        - tests_pending/test_zs09_drop_nulls.py::test_drop_nulls_keeps_complete_row_unchanged
        - tests_pending/test_zs09_drop_nulls.py::test_drop_nulls_ignores_nulls_in_unnamed_fields
        - tests_pending/test_zs09_drop_nulls.py::test_drop_nulls_without_fields_checks_every_field
        - tests_pending/test_zs09_drop_nulls.py::test_drop_nulls_without_fields_keeps_empty_row
        - tests_pending/test_zs09_drop_nulls.py::test_drop_nulls_does_not_treat_falsy_values_as_null
        - tests_pending/test_zs09_drop_nulls.py::test_drop_nulls_accepts_a_tuple_of_fields
        - tests_pending/test_zs09_drop_nulls.py::test_drop_nulls_in_a_pipeline_counts_skipped_rows
      tests_must_still_pass:
        - tests/test_transforms.py::test_filter_rows_drops_by_returning_none
        - tests/test_transforms.py::test_apply_all_short_circuits_on_drop
        - tests/test_pipeline.py::test_run_counts_dropped_rows_as_skipped
        - tests/test_pipeline.py::test_dropped_rows_never_reach_the_sink
      forbidden_changes:
        - tests/
        - tests_pending/
        - pyproject.toml
    expected_outcome: approve
    infeasible_reason: null
    notes: >
      Single file (src/etl/transforms.py). The drop protocol
      (Transform returning None, honoured by Pipeline.run and counted in
      rows_skipped) is deliberately already in the baseline and guarded by
      tests, so this really is a one-file change. The falsy-vs-null trap is
      the point: `if not row[f]` passes most tests and fails one.
      Errors at import at baseline.

  - id: ZS-10
    kind: single_file
    fixture: fixtures/configkit
    goal: >
      `deep_merge` always replaces lists. Add a keyword-only
      `list_strategy` parameter accepting "replace" (the current and default
      behaviour), "append" (base list then override list) and "unique"
      (concatenation preserving first-seen order with duplicates removed).
      The strategy must apply at every depth, must not mutate either input,
      and an unrecognised strategy must raise ValueError.
    acceptance:
      parse_ok: true
      lint_clean: true
      typecheck_clean: true
      tests_pass:
        - tests_pending/test_zs10_list_merge_strategies.py::test_replace_is_still_the_default
        - tests_pending/test_zs10_list_merge_strategies.py::test_replace_strategy_top_level
        - tests_pending/test_zs10_list_merge_strategies.py::test_replace_strategy_nested
        - tests_pending/test_zs10_list_merge_strategies.py::test_append_strategy_top_level
        - tests_pending/test_zs10_list_merge_strategies.py::test_append_strategy_nested
        - tests_pending/test_zs10_list_merge_strategies.py::test_append_uses_the_override_list_when_the_key_is_new
        - tests_pending/test_zs10_list_merge_strategies.py::test_unique_strategy_top_level_preserves_first_seen_order
        - tests_pending/test_zs10_list_merge_strategies.py::test_unique_strategy_nested
        - tests_pending/test_zs10_list_merge_strategies.py::test_strategies_do_not_mutate_the_input_lists
        - tests_pending/test_zs10_list_merge_strategies.py::test_non_list_values_are_unaffected_by_the_strategy
        - tests_pending/test_zs10_list_merge_strategies.py::test_unknown_strategy_raises_value_error
      tests_must_still_pass:
        - tests/test_merge.py::test_deep_merge_replaces_lists_at_top_level
        - tests/test_merge.py::test_deep_merge_replaces_lists_when_nested
        - tests/test_merge.py::test_deep_merge_does_not_mutate_its_inputs
        - tests/test_merge.py::test_merge_all_applies_layers_left_to_right
      forbidden_changes:
        - tests/
        - tests_pending/
        - pyproject.toml
    expected_outcome: approve
    infeasible_reason: null
    notes: >
      Single file (src/configkit/merge.py). Threading a new parameter through
      a recursive function - the common failure is applying the strategy only
      at the top level. All 11 tests fail at baseline with TypeError on the
      unexpected keyword, including the "default is unchanged" test, which is
      written as an equality between the defaulted and explicit calls
      precisely so it cannot pass before the change.

