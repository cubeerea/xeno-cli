      integer ratios without losing or inventing a single cent. Remainder
      cents are handed out one at a time to the earliest buckets. The
      allocated parts must always sum exactly to the original amount and keep
      its currency. Empty, all-zero, or negative ratios raise ValueError.
    acceptance:
      parse_ok: true
      lint_clean: true
      typecheck_clean: true
      tests_pass:
        - tests_pending/test_zs06_allocate.py::test_allocate_five_cents_over_three_seven
        - tests_pending/test_zs06_allocate.py::test_allocate_hundred_over_three_equal_shares
        - tests_pending/test_zs06_allocate.py::test_allocate_remainder_goes_to_earliest_buckets
        - tests_pending/test_zs06_allocate.py::test_allocate_is_exact_when_it_divides_evenly
        - tests_pending/test_zs06_allocate.py::test_allocate_loses_no_cents
        - tests_pending/test_zs06_allocate.py::test_allocate_ignores_zero_weighted_buckets
        - tests_pending/test_zs06_allocate.py::test_allocate_preserves_currency
        - tests_pending/test_zs06_allocate.py::test_allocate_rejects_empty_ratios
