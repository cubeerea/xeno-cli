        - pyproject.toml
    expected_outcome: approve
    infeasible_reason: null
    notes: >
      Single file (src/ledger/money.py). The classic Fowler "allocate"
      problem: the obvious per-bucket rounding implementation passes the easy
      cases and fails the conservation invariant. Ten assert-failing tests at
      baseline. Feasibility confirmed against a reference solution.

  - id: ZS-07
