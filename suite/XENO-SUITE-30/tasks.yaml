# XENO-SUITE-30 - the frozen reliability/cost measurement population.
#
# Authored in Phase 0 per PRD v2.2 S13, per S15 MEASUREMENT POPULATIONS:
#   30 tasks - 10 single-file, 15 multi-file, 5 deliberately infeasible.
#
# Every acceptance criterion below is decided by running a tool and reading its
# exit code or its per-node results (tree-sitter parse, ruff, mypy, pytest,
# `git diff --name-only`). Nothing here is scored by a human or a model. This is
# the S10 Odysseus constraint - "a task Talos cannot check is a malformed task" -
# applied to the suite itself.
#
# Only `goal:` is ever shown to the harness. `acceptance:`, `notes:` and
# `infeasible_reason:` belong to the scorer.
#
# See ../README.md for the fixture anatomy (tests/ vs tests_pending/), the gate
# mapping, and the freeze policy.

suite: XENO-SUITE-30
version: 1
frozen: true              # authored Phase 0, must not change once measurement begins
tasks:

  # ---------------------------------------------------------------- SINGLE-FILE

  - id: ZS-01
    kind: single_file
    fixture: fixtures/taskcli
    goal: >
      The `list` command can filter by status but not by priority. Add a
      `--priority` option to the `list` subcommand that accepts one of
      low/normal/high and shows only tasks at that priority. It must compose
      with the existing `--status` filter (both applied together, AND
      semantics), and the table must still render its header and the
      "(no tasks)" line when the filters match nothing.
    acceptance:
      parse_ok: true
      lint_clean: true
      typecheck_clean: true
      tests_pass:
        - tests_pending/test_zs01_priority_filter.py::test_list_filters_by_priority
        - tests_pending/test_zs01_priority_filter.py::test_priority_filter_combines_with_status
      tests_must_still_pass:
        - tests/test_cli.py::test_add_then_list
        - tests/test_cli.py::test_list_empty_shows_header
        - tests/test_cli.py::test_done_and_status_filter
      forbidden_changes:
        - tests/
        - tests_pending/
        - pyproject.toml
    expected_outcome: approve
    infeasible_reason: null
    notes: >
      Easiest task in the suite; the floor of M2.1. Argument parsing plus a
      list comprehension in src/taskcli/cli.py. Priority already exists on the
      model, so nothing outside cli.py needs to change. Both acceptance tests
      exist in the fixture and FAIL at baseline (unrecognised argument
      --priority). Feasibility confirmed against a reference solution.

  - id: ZS-02
    kind: single_file
    fixture: fixtures/taskcli
    goal: >
      Long task titles blow out the table layout. In the formatting module,
      add a `truncate(text, width)` helper and a module-level `TITLE_WIDTH`
      constant set to 40, and use them so every rendered row's title is
      clipped to at most TITLE_WIDTH characters. When clipping occurs the
      result must end in "..." and be exactly `width` characters long; text
      at or under the width is returned unchanged; a width below 4 raises
      ValueError.
    acceptance:
      parse_ok: true
      lint_clean: true
      typecheck_clean: true
      tests_pass:
        - tests_pending/test_zs02_truncate_titles.py::test_truncate_leaves_short_text_alone
        - tests_pending/test_zs02_truncate_titles.py::test_truncate_appends_ellipsis_and_respects_width
        - tests_pending/test_zs02_truncate_titles.py::test_truncate_rejects_widths_below_four
        - tests_pending/test_zs02_truncate_titles.py::test_title_width_is_forty
        - tests_pending/test_zs02_truncate_titles.py::test_render_table_truncates_long_titles
      tests_must_still_pass:
        - tests/test_cli.py::test_add_then_list
        - tests/test_cli.py::test_list_empty_shows_header
      forbidden_changes:
        - tests/
        - tests_pending/
        - pyproject.toml
    expected_outcome: approve
    infeasible_reason: null
    notes: >
      String handling with exact off-by-one semantics in
      src/taskcli/formatting.py. Stresses precise boundary conditions
      (len(result) == width, not width + 3) that a plausible-looking wrong
      implementation fails. Errors at import at baseline: TITLE_WIDTH and
      truncate do not exist. Feasibility confirmed against a reference
      solution.

  - id: ZS-03
    kind: single_file
    fixture: fixtures/taskcli
    goal: >
      TaskStore.save() writes the JSON store in place, so an interrupted
      write corrupts the database. Make save() atomic: serialise to a
      temporary file in the same directory, then move it into place with
      `os.replace` (import the `os` module in the store module, so the call
      site is `os.replace`). If the replace fails, the exception must
      propagate, the previous file contents must be left exactly as they
      were, and no temporary file may be left behind.
    acceptance:
      parse_ok: true
      lint_clean: true
      typecheck_clean: true
      tests_pass:
        - tests_pending/test_zs03_atomic_save.py::test_failed_replace_preserves_original_file
        - tests_pending/test_zs03_atomic_save.py::test_save_propagates_replace_failure
      tests_must_still_pass:
        - tests/test_store.py::test_add_save_reload
        - tests/test_store.py::test_load_missing_file_is_empty
        - tests/test_store.py::test_load_rejects_invalid_json
      forbidden_changes:
        - tests/
        - tests_pending/
        - pyproject.toml
    expected_outcome: approve
    infeasible_reason: null
    notes: >
      Single file (src/taskcli/store.py) but requires a durability pattern
      rather than a feature: temp file, os.replace, cleanup in a finally
      block. The acceptance tests monkeypatch `taskcli.store.os.replace` to
      raise; the goal states this explicitly so the required call site is
      mechanically determined rather than guessed. Both tests fail at
      baseline (the monkeypatch is inert and the file is clobbered).
      Feasibility confirmed against a reference solution.

  - id: ZS-04
    kind: single_file
    fixture: fixtures/textstats
    goal: >
      The tokenizer splits on every non-alphabetic character, so
      "state-of-the-art" becomes four tokens and "don't" becomes two. Change
      it to preserve hyphens and apostrophes that sit BETWEEN letters, so
      each of those is a single token, while still stripping leading and
      trailing punctuation and never emitting a bare hyphen or quote as a
      token.
    acceptance:
      parse_ok: true
      lint_clean: true
      typecheck_clean: true
      tests_pass:
        - tests_pending/test_zs04_intra_word_punctuation.py::test_intra_word_hyphens_are_preserved
        - tests_pending/test_zs04_intra_word_punctuation.py::test_intra_word_apostrophes_are_preserved
        - tests_pending/test_zs04_intra_word_punctuation.py::test_edge_punctuation_is_still_stripped
        - tests_pending/test_zs04_intra_word_punctuation.py::test_bare_hyphen_or_quote_is_never_a_token
        - tests_pending/test_zs04_intra_word_punctuation.py::test_simple_tokenisation_is_unchanged
      tests_must_still_pass:
        - tests/test_tokenizer.py::test_tokenize_lowercases_and_drops_surrounding_punctuation
        - tests/test_tokenizer.py::test_tokenize_ignores_digits_and_symbols
        - tests/test_tokenizer.py::test_tokenize_empty_and_punctuation_only
        - tests/test_stats.py::test_word_frequencies_counts_and_orders
      forbidden_changes:
        - tests/
        - tests_pending/
        - pyproject.toml
    expected_outcome: approve
    infeasible_reason: null
    notes: >
      One regex in src/textstats/tokenizer.py, but the change ripples into
      every downstream count, so the regression guards matter more than the
      new tests. All five acceptance tests assert-fail at baseline.
      Feasibility confirmed against a reference solution.

